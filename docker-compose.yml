version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: oil_india_postgres
    restart: always
    environment:
      POSTGRES_USER: oil_user
      POSTGRES_PASSWORD: oil_password
      POSTGRES_DB: digital_twin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oil_user -d digital_twin"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oil_india_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://oil_user:oil_password@postgres:5432/digital_twin
      - API_BASE_URL=http://api:8000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: oil_india_frontend
    restart: always
    depends_on:
      - api
    environment:
      - API_BASE_URL=http://api:8000
    ports:
      - "8501:8501"

volumes:
  pgdata:
